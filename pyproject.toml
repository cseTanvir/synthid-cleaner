[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthid-cleaner"
version = "1.0.0"
description = "Strip C2PA/EXIF metadata and disrupt imperceptible SynthID watermarks on AI-generated images."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Md Tanvir Hossain", email = "tanvirhossain1994@gmail.com" }
]
keywords = [
    "synthid",
    "c2pa",
    "watermark",
    "sanitizer",
    "ai-images",
    "image-processing",
    "deepmind",
    "metadata-stripper",
    "exif-cleaner"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.22.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/cseTanvir/synthid-cleaner"
Repository = "https://github.com/cseTanvir/synthid-cleaner.git"
Issues = "https://github.com/cseTanvir/synthid-cleaner/issues"

[project.scripts]
synthid-cleaner = "synthid_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synthid_cleaner*"]
